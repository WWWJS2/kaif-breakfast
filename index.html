<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>كايف</title>
<meta name="theme-color" content="#FFFCF8">
<link rel="icon" href="assets/img/kaif-logo.png">
<link rel="preload" as="image" href="assets/img/morning.webp" imagesrcset="assets/img/morning-sm.webp 900w, assets/img/morning.webp 2000w" imagesizes="100vw">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/invite.css?v=20261111-2">
</head>
<body class="is-loading">

<!-- ============ OPENING · full morning light ============ -->
<section class="hero" id="top" aria-label="كايف">
  <div class="hero__pin">
    <figure class="hero__photo" aria-hidden="true">
      <img src="assets/img/morning.webp" srcset="assets/img/morning-sm.webp 900w, assets/img/morning.webp 2000w" sizes="100vw" alt="" fetchpriority="high">
    </figure>
    <span class="hero__veil" aria-hidden="true"></span>
    <span class="hero__curtain hero__curtain--t" aria-hidden="true"></span>
    <span class="hero__curtain hero__curtain--b" aria-hidden="true"></span>

    <div class="hero__seal"><img src="assets/img/kaif-logo.png" alt="كايف المزرعة" width="941" height="1432"></div>

    <div class="hero__meta">
      <h1 class="hero__welcome">صباحك بين النخيل في كايف المزرعة</h1>
      <p class="hero__sub">نتشرف بحضوركم لتجربة فطور كايف الخاصة</p>
      <p class="hero__body">تجربة استثنائية وسط أجواء المزرعة الهادئة والمذاق الرفيع.<br> يرجى تأكيد حجزكم لتوفير تجربة تليق بكم.</p>
    </div>

    <a class="hero__cue" href="#invite" aria-label="اختر اليوم المناسب">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m0 0-5-5m5 5 5-5"/></svg>
    </a>
  </div>
</section>

<!-- ============ THE INVITATION ============ -->
<main class="book" id="invite">
  <!-- desktop: the photograph stays beside you and changes with each choice -->
  <aside class="book__media" aria-hidden="true">
    <img class="media is-on" data-key="lamp"    src="assets/img/lamp.webp"    alt="" loading="lazy">
    <img class="media"       data-key="table"   src="assets/img/table.webp"   alt="" loading="lazy">
    <img class="media"       data-key="shadows" src="assets/img/shadows.webp" alt="" loading="lazy">
    <img class="media"       data-key="lounge"  src="assets/img/lounge.webp"  alt="" loading="lazy">
  </aside>

  <div class="book__sheet">
    <span class="sheet__grip" aria-hidden="true"></span>
    <form class="form" id="booking" novalidate>

      <div class="step" data-step="1" data-img="lamp">
        <label class="step__label" for="guest">الاسم <b class="req" aria-hidden="true">*</b></label>
        <div class="namefield">
          <input id="guest" name="guest" type="text" placeholder="الاسم" autocomplete="name" required minlength="2" maxlength="80" enterkeyhint="next">
        </div>
      </div>

      <div class="step" data-step="2" data-img="lamp">
        <label class="step__label" for="phone">الرقم <b class="req" aria-hidden="true">*</b></label>
        <div class="namefield"><input id="phone" name="phone" type="tel" placeholder="05xxxxxxxx" autocomplete="tel" inputmode="tel" required maxlength="20" dir="ltr" enterkeyhint="next"></div>
      </div>

      <div class="step" data-step="3" data-img="table">
        <span class="step__label" id="day-label">اختر اليوم المناسب <b class="req" aria-hidden="true">*</b></span>
        <div class="dd" data-dd="day" aria-labelledby="day-label"></div>
      </div>

      <div class="step" data-step="4" data-img="shadows">
        <span class="step__label" id="time-label"><span data-time-label>الوقت</span> <b class="req" aria-hidden="true">*</b></span>
        <div class="dd" data-dd="time" aria-labelledby="time-label"></div>
      </div>

      <div class="step" data-step="5" data-img="lounge">
        <span class="step__label" id="people-label">المرافقين <b class="req" aria-hidden="true">*</b></span>
        <div class="counter" role="group" aria-labelledby="people-label">
          <button type="button" data-count-minus aria-label="تقليل المرافقين">−</button>
          <input type="number" id="companions" value="1" min="1" max="9" readonly role="spinbutton" aria-labelledby="people-label" aria-valuemin="1" aria-valuemax="9" aria-valuenow="1">
          <button type="button" data-count-plus aria-label="زيادة المرافقين">+</button>
        </div>
      </div>

      <div class="submit">
        <p class="notice" data-notice role="status" aria-live="polite" hidden></p>
        <button class="cta" type="submit" data-cta>
          <span class="cta__fill" aria-hidden="true"></span>
          <span class="cta__text">تأكيد حجز الدعوة</span>
          <span class="cta__arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 12H4m0 0 6-6m-6 6 6 6"/></svg></span>
        </button>
      </div>
    </form>
  </div>
</main>

<!-- ============ CLOSING · a slow reel of the farm ============ -->
<footer class="reel" aria-hidden="true">
  <div class="reel__row"><div class="reel__track"><img src="assets/img/reel-01.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-02.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-03.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-04.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-05.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-06.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-07.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-08.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-09.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-01.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-02.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-03.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-04.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-05.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-06.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-07.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-08.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-09.webp" alt="" loading="lazy" width="480" height="600"></div></div>
  <div class="reel__row reel__row--rev"><div class="reel__track"><img src="assets/img/reel-10.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-11.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-12.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-13.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-14.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-15.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-16.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-17.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-18.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-10.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-11.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-12.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-13.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-14.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-15.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-16.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-17.webp" alt="" loading="lazy" width="480" height="600"><img src="assets/img/reel-18.webp" alt="" loading="lazy" width="480" height="600"></div></div>
  <div class="reel__seal"><img src="assets/img/kaif-logo.png" alt="" loading="lazy"></div>
</footer>

<!-- ============ CONFIRMATION ============ -->
<dialog class="ticket" data-ticket aria-labelledby="ticket-name">
  <div class="ticket__card">
    <button class="ticket__close" type="button" data-ticket-close aria-label="×">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <figure class="ticket__photo"><img src="assets/img/morning-sm.webp" alt="" loading="lazy"></figure>
    <div class="ticket__seal"><img src="assets/img/kaif-logo.png" alt="كايف المزرعة"></div>
    <p class="ticket__title" data-ticket-title hidden></p>
    <svg class="ticket__check" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l7 7 15-16"/></svg>
    <dl class="ticket__rows">
      <div><dt>الاسم</dt><dd id="ticket-name" data-t="name"></dd></div>
      <div><dt>الرقم</dt><dd class="tnum" data-t="phone"></dd></div>
      <div><dt>اختر اليوم المناسب</dt><dd data-t="day"></dd></div>
      <div><dt data-t="timeLabel"></dt><dd class="tnum" data-t="time"></dd></div>
      <div><dt>المرافقين</dt><dd data-t="people"></dd></div>
    </dl>
  </div>
</dialog>

<script src="assets/js/config.js"></script>
<script src="assets/vendor/supabase.js" defer></script>
<script src="assets/vendor/gsap.min.js" defer></script>
<script src="assets/vendor/ScrollTrigger.min.js" defer></script>
<script type="module" src="assets/js/invite.js?v=20261111-2"></script>
</body>
</html>
